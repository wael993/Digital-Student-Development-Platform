name: digital_student
description: رحلتي mobile and tablet application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  json_annotation: ^4.12.0
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../logo.jpeg
  adaptive_icon_background: "#0288D1"
  adaptive_icon_foreground: ../../logo.jpeg

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
